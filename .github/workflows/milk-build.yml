name: MILK Android APK

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "README.md"
      - "package.json"
      - "capacitor.config.json"
      - "native/**"
      - ".github/workflows/milk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MILK Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          accept-android-sdk-licenses: true
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web app
        run: |
          test -f index.html
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Install native gallery bridge and milk icon
        run: |
          mkdir -p android/app/src/main/java/com/milk/backupgallery
          mkdir -p android/app/src/main/res/drawable
          cp native/MediaGalleryPlugin.java android/app/src/main/java/com/milk/backupgallery/
          cp native/MainActivity.java android/app/src/main/java/com/milk/backupgallery/
          cp native/ic_milk_carton.xml android/app/src/main/res/drawable/
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          permissions = [
              ('android.permission.READ_MEDIA_IMAGES', None),
              ('android.permission.READ_MEDIA_VIDEO', None),
              ('android.permission.READ_MEDIA_VISUAL_USER_SELECTED', None),
              ('android.permission.READ_EXTERNAL_STORAGE', '32'),
          ]
          existing = {item.get('{' + android_ns + '}name') for item in root.findall('uses-permission')}
          for name, max_sdk in permissions:
              if name in existing:
                  continue
              item = ET.Element('uses-permission')
              item.set('{' + android_ns + '}name', name)
              if max_sdk:
                  item.set('{' + android_ns + '}maxSdkVersion', max_sdk)
              root.insert(0, item)

          application = root.find('application')
          if application is None:
              raise SystemExit('AndroidManifest.xml has no application element')
          application.set('{' + android_ns + '}icon', '@drawable/ic_milk_carton')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          ET.parse(manifest)
          print('Android manifest validated; milk carton icon and media permissions configured.')
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MILK-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
