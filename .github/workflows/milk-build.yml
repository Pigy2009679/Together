name: MILK Android APK

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "README.md"
      - "package.json"
      - "capacitor.config.json"
      - "native/**"
      - ".github/workflows/milk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MILK Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          accept-android-sdk-licenses: true
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web app
        run: |
          test -f index.html
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Install native gallery bridge and milk icon
        run: |
          mkdir -p android/app/src/main/java/com/milk/backupgallery
          mkdir -p android/app/src/main/res/drawable
          cp native/MediaGalleryPlugin.java android/app/src/main/java/com/milk/backupgallery/
          cp native/MainActivity.java android/app/src/main/java/com/milk/backupgallery/
          cp native/ic_milk_carton.xml android/app/src/main/res/drawable/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = """
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
          """
          s = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + permissions, s, count=1)
          s = re.sub(r'<application\b', '<application android:icon="@drawable/ic_milk_carton"', s, count=1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MILK-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
