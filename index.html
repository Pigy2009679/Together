<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6"><title>MILK Gallery</title>
<style>
:root{color-scheme:light;--bg:#f5f0e6;--paper:#fffefa;--ink:#514638;--muted:#968978;--line:#e9e0d2;--accent:#806b50;--blue:#dcebed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1100px;margin:auto;padding:env(safe-area-inset-top) 15px calc(24px + env(safe-area-inset-bottom))}.top{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 32px Georgia,serif;letter-spacing:-1.8px}.brand span{color:#b9a486}.top-actions{display:flex;gap:8px}.iconbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--paper);font-size:19px}.search{display:flex;align-items:center;gap:9px;background:#fffefa;border:1px solid var(--line);border-radius:16px;padding:0 14px;height:48px;margin:7px 0 17px}.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink)}.heading{display:flex;justify-content:space-between;align-items:end;margin:18px 0 13px}.heading h1{font:30px Georgia,serif;margin:0}.count{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:13px;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--paper);border-radius:22px;padding:9px 16px;font-size:13px}.tabs button.active{background:#e6ddcf;border-color:#d7c8b2;font-weight:650}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.tile{position:relative;aspect-ratio:1;background:#e9e3d8;border-radius:5px;overflow:hidden;border:0;padding:0}.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}.tile .vid{position:absolute;right:7px;bottom:7px;background:#0009;color:white;border-radius:20px;padding:3px 7px;font-size:11px}.empty{grid-column:1/-1;text-align:center;padding:65px 18px;background:var(--paper);border:1px dashed #d9cbb7;border-radius:20px;color:var(--muted)}.empty b{display:block;font:25px Georgia,serif;color:var(--ink);margin-bottom:8px}.empty .carton{font-size:35px;margin-bottom:12px}.notice{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#514638;color:white;padding:12px 18px;border-radius:24px;z-index:9;display:none;max-width:90%;text-align:center}.viewer{position:fixed;inset:0;background:#171512f5;z-index:10;display:none;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}.viewer.open{display:flex}.viewtop{display:flex;align-items:center;justify-content:space-between;color:white;min-height:55px}.viewtop button{background:#ffffff20;color:white;border:0;border-radius:50%;width:40px;height:40px;font-size:20px}.viewname{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}.viewbody{flex:1;min-height:0;display:grid;place-items:center}.viewbody img,.viewbody video{max-width:100%;max-height:100%;object-fit:contain}.bottomnav{position:sticky;bottom:0;background:var(--bg);padding:14px 0 max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center;color:var(--muted);font-size:12px}.bottomnav span{background:#e9e0d2;padding:9px 16px;border-radius:22px}@media(min-width:650px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.app{padding-left:24px;padding-right:24px}}@media(min-width:900px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style></head><body>
<main class="app">
<header class="top"><div class="brand">milk<span>.</span></div><div class="top-actions"><button class="iconbtn" id="refresh" aria-label="Refresh gallery" title="Refresh">↻</button><button class="iconbtn" id="settings" aria-label="Gallery settings" title="Settings">⚙</button></div></header>
<label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search photos and videos" aria-label="Search photos and videos"><button id="clear" class="iconbtn" style="width:30px;height:30px;font-size:15px;border:0;background:transparent" aria-label="Clear search">×</button></label>
<div class="heading"><h1 id="sectionTitle">Recent</h1><span class="count" id="count">Loading…</span></div>
<nav class="tabs" id="tabs" aria-label="Gallery categories"><button class="active" data-filter="all">All</button><button data-filter="image">Photos</button><button data-filter="video">Videos</button></nav>
<section class="grid" id="grid" aria-live="polite"><div class="empty"><div class="carton">🥛</div><b>Loading your gallery</b>Looking for photos and videos on this device…</div></section>
<div class="bottomnav"><span>🥛 &nbsp; MILK · Your personal gallery</span></div>
</main>
<div class="viewer" id="viewer"><div class="viewtop"><button id="closeViewer" aria-label="Close">×</button><div class="viewname" id="viewname"></div><button id="share" aria-label="Share file">↗</button></div><div class="viewbody" id="viewbody"></div></div>
<div class="notice" id="notice" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let media=[],filter='all',current=null,plugin=null;
function toast(s){const n=$('notice');n.textContent=s;n.style.display='block';clearTimeout(window.milkToastTimer);window.milkToastTimer=setTimeout(()=>n.style.display='none',2600)}
function fmt(n){if(!n)return'';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
function cap(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.MediaGallery?window.Capacitor.Plugins.MediaGallery:null}
function render(){const q=$('search').value.trim().toLowerCase();const list=media.filter(x=>(filter==='all'||x.kind===filter)&&String(x.name||'').toLowerCase().includes(q));$('count').textContent=list.length+' '+(list.length===1?'item':'items');$('sectionTitle').textContent=filter==='image'?'Photos':filter==='video'?'Videos':'Recent';const grid=$('grid');grid.replaceChildren();if(!list.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<div class="carton">🥛</div><b>'+(media.length?'No matching files':'Your gallery is empty')+'</b>'+(media.length?'Try another search or category.':'Allow photo and video access to see your existing media here.');grid.append(e);return}for(const item of list){const b=document.createElement('button');b.className='tile';b.type='button';b.setAttribute('aria-label',item.name||'Open media');if(item.kind==='image'){const im=document.createElement('img');im.src=item.uri;im.alt='';im.loading='lazy';b.append(im)}else{const v=document.createElement('video');v.src=item.uri;v.muted=true;v.preload='metadata';b.append(v);const tag=document.createElement('span');tag.className='vid';tag.textContent='▶ Video';b.append(tag)}b.addEventListener('click',()=>openViewer(item));grid.append(b)}}
function openViewer(item){current=item;$('viewname').textContent=item.name||'Media';const body=$('viewbody');body.replaceChildren();const el=document.createElement(item.kind==='video'?'video':'img');el.src=item.uri;if(item.kind==='video'){el.controls=true;el.autoplay=true;el.playsInline=true}else el.alt=item.name||'Photo';body.append(el);$('viewer').classList.add('open')}
function closeViewer(){$('viewer').classList.remove('open');$('viewbody').replaceChildren();current=null}
async function refresh(){plugin=cap();if(!plugin){$('grid').innerHTML='<div class="empty"><div class="carton">🥛</div><b>Open MILK on your Android phone</b>The automatic gallery needs the Android app and photo access.</div>';$('count').textContent='';return}try{const result=await plugin.getMedia();media=(result.items||[]).sort((a,b)=>b.date-a.date);render()}catch(e){if(e&&e.code==='PERMISSION_REQUIRED'){await requestAccess()}else{toast('Could not read your gallery. Try refreshing.');$('count').textContent='';}}}
async function requestAccess(){try{const r=await plugin.requestAccess();if(r.granted){toast('Gallery access enabled');await refresh()}else{$('grid').innerHTML='<div class="empty"><div class="carton">🥛</div><b>Permission needed</b>Allow MILK to access photos and videos in Android settings to show your gallery.</div>'}}catch(e){toast('Could not request photo access. Check Android app permissions.');}}
$('refresh').addEventListener('click',refresh);
$('settings').addEventListener('click',()=>toast('Use Android Settings → Apps → MILK → Permissions to change photo and video access.'));
$('clear').addEventListener('click',()=>{$('search').value='';render();$('search').focus()});
$('search').addEventListener('input',render);
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});
$('closeViewer').addEventListener('click',closeViewer);
$('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))closeViewer()});
$('share').addEventListener('click',async()=>{if(!current)return;try{if(navigator.share)await navigator.share({title:current.name||'MILK media',url:current.uri});else toast('Sharing is not available on this device.')}catch(e){if(e.name!=='AbortError')toast('Could not share this file.')}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
window.addEventListener('focus',refresh);
(async()=>{plugin=cap();if(plugin&&plugin.addListener){try{await plugin.addListener('mediaChanged',refresh)}catch(e){}}await refresh()})();
</script></body></html>
